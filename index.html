<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile DevTools Injector</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #1e1e1e; color: #fff; padding: 20px; box-sizing: border-box; }
        input { width: 100%; max-width: 400px; padding: 12px; margin: 10px 0; border: none; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; border: none; border-radius: 4px; background: #007bff; color: #fff; font-size: 16px; cursor: pointer; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <!-- URL Prompt Screen -->
    <div id="setup">
        <h3>Enter Target URL (e.g., HackTheBox IP:Port)</h3>
        <input type="text" id="targetUrl" placeholder="http://154.57.164.73:32041" value="http://154.57.164.73:32041">
        <button onclick="launchTarget()">Launch with Eruda</button>
    </div>

    <!-- Target Website Container -->
    <iframe id="siteFrame"></iframe>

    <!-- Eruda Core and Initialization Scripts -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // Initialize Eruda on the main GitHub Page container
        eruda.init();

        function launchTarget() {
            let url = document.getElementById('targetUrl').value.trim();
            
            if (!url) {
                alert('Please enter a valid URL');
                return;
            }

            // Ensure the URL has a protocol
            if (!/^https?:\/\//i.test(url)) {
                url = 'http://' + url;
            }

            const frame = document.getElementById('siteFrame');
            const setupDiv = document.getElementById('setup');

            // Hide the setup prompt and display the iframe target
            setupDiv.style.display = 'none';
            frame.style.width = '100%';
            frame.style.height = '100%';
            frame.style.display = 'block';
            frame.src = url;

            // Open the Eruda console automatically on mobile
            eruda.show();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile DevTools Link Generator</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 30px; text-align: center; }
        .container { max-width: 500px; margin: 50px auto; background: #2a2a2a; padding: 30px; border-radius: 8px; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #444; background: #333; color: #fff; border-radius: 4px; font-size: 16px; }
        button { background: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 94%; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mobile DevTools Launcher</h2>
    <p>Enter your HackTheBox target URL below:</p>
    <input type="text" id="targetUrl" value="http://154.57.164.73:32041" placeholder="http://154.57.164.73:32041">
    <button onclick="launchInNewTab()">Launch Target with Eruda</button>
</div>

<script>
function launchInNewTab() {
    let url = document.getElementById('targetUrl').value.trim();
    if (!url) return alert('Please enter a URL');
    if (!/^https?:\/\//i.test(url)) url = 'http://' + url;

    // The HTML content payload that will execute in the new tab
    const payload = `
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injected Environment</title>
    <style>
        html, body { margin:0; padding:0; height:100%; overflow:hidden; }
        iframe { width:100%; height:100%; border:none; }
    </style>
    <script src="https://jsdelivr.net"><\/script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            eruda.init();
            eruda.show();
        });
    <\/script>
</head>
<body>
    <iframe src="${url}"></iframe>
</body>
</html>`;

    // Convert the payload into a Base64 Data URI
    const dataUri = "data:text/html;base64," + btoa(unescape(encodeURIComponent(payload)));
    
    // Open the payload in a new tab
    window.open(dataUri, '_blank');
}
</script>

</body>
</html>

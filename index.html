<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile DevTools Launcher</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 30px; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: 50px auto; background: #2a2a2a; padding: 30px; border-radius: 8px; box-sizing: border-box; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #444; background: #333; color: #fff; border-radius: 4px; font-size: 16px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 94%; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div id="ui-container" class="container">
    <h2>Mobile DevTools Launcher</h2>
    <p>Enter your HackTheBox target URL below:</p>
    <input type="text" id="targetUrl" value="http://154.57.164.73:32041" placeholder="http://154.57.164.73:32041">
    <button onclick="launchInSameTab()">Launch Target in This Tab</button>
</div>

<!-- Dynamically loaded Eruda dependency -->
<script src="https://jsdelivr.net"></script>
<script>
function launchInSameTab() {
    let url = document.getElementById('targetUrl').value.trim();
    if (!url) return alert('Please enter a URL');
    if (!/^https?:\/\//i.test(url)) url = 'http://' + url;

    // 1. Wipe out the selection UI entirely
    document.getElementById('ui-container').remove();
    
    // 2. Adjust body properties to host a full-screen frame layout
    document.body.style.padding = "0";
    document.body.style.height = "100vh";
    document.body.style.overflow = "hidden";

    // 3. Create and append the target frame layout
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    document.body.appendChild(iframe);

    // 4. Initialize and display Eruda within the current context
    eruda.init();
    eruda.show();
}
</script>

</body>
</html>

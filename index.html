<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Online DevTools Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #fff; overflow: hidden; }
        #setup-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #00e676; }
        p { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; max-width: 300px; }
        input { width: 100%; max-width: 400px; padding: 12px; border: 2px solid #333; background: #222; color: #fff; border-radius: 8px; font-size: 1rem; margin-bottom: 15px; outline: none; }
        input:focus { border-color: #00e676; }
        button { width: 100%; max-width: 400px; padding: 12px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 1rem; border-radius: 8px; cursor: pointer; }
        button:active { background: #00c853; }
        #viewer-frame { width: 100%; height: 100%; border: none; display: none; background: #fff; }
    </style>
</head>
<body>

    <!-- URL Input Screen -->
    <div id="setup-container">
        <h1>Mobile DevTools Launcher</h1>
        <p>Enter a URL below to view the site with Eruda DevTools injected.</p>
        <input type="url" id="url-input" placeholder="https://example.com" value="https://example.com">
        <button onclick="launchSite()">Open with DevTools</button>
    </div>

    <!-- Website Viewer Screen -->
    <iframe id="viewer-frame"></iframe>

    <script>
        function launchSite() {
            let url = document.getElementById('url-input').value.trim();
            if (!url) return alert('Please enter a valid URL');

            // Automatically prepend https:// if missing
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            const frame = document.getElementById('viewer-frame');
            const container = document.getElementById('setup-container');

            // Use a public AllOrigins CORS proxy to fetch the target website data
            const proxyUrl = `https://allorigins.win{encodeURIComponent(url)}`;

            fetch(proxyUrl)
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Network response was not ok.');
                })
                .then(data => {
                    // Hide the setup menu and reveal the iframe
                    container.style.display = 'none';
                    frame.style.display = 'block';

                    // Get the document context inside the iframe
                    const frameDoc = frame.contentWindow.document;
                    frameDoc.open();

                    // 1. Rewrite relative paths to absolute paths so assets load through the proxy context
                    let htmlContent = data.contents;
                    const targetOrigin = new URL(url).origin;
                    
                    // Basic regex fixes for common absolute pathing issues inside proxies
                    htmlContent = htmlContent.replace(/(src|href)=['"]\/(?!\/)/g, `$1="${targetOrigin}/`);

                    // 2. Inject the Eruda DevTools scripts directly into the fetched HTML string
                    const erudaScripts = `
                        <script src="https://jsdelivr.net"><\/script>
                        <script>
                            (function() {
                                // Wait for Eruda to load globally, then initialize it
                                function initEruda() {
                                    if (window.eruda) {
                                        window.eruda.init({
                                            defaults: {
                                                displaySize: 50,
                                                theme: 'Dark'
                                            }
                                        });
                                        window.eruda.show();
                                    } else {
                                        setTimeout(initEruda, 100);
                                    }
                                }
                                initEruda();
                            })();
                        <\/script>
                    `;

                    // Insert scripts right before the closing </body> tag
                    if (htmlContent.includes('</body>')) {
                        htmlContent = htmlContent.replace('</body>', `${erudaScripts}</body>`);
                    } else {
                        htmlContent += erudaScripts;
                    }

                    // Write the modified HTML into the frame
                    frameDoc.write(htmlContent);
                    frameDoc.close();
                })
                .catch(err => {
                    alert('Error loading page through proxy: ' + err.message);
                    console.error(err);
                });
        }
    </script>
</body>
</html>

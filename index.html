<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Engineering Hub</title>

<style>

:root {
    --bg:#101418;
    --card:#1b2229;
    --accent:#4fc3f7;
    --green:#4caf50;
    --text:#f5f5f5;
    --muted:#aaa;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,Arial,sans-serif;
}


header {
    background:#0d47a1;
    padding:18px;
    text-align:center;
}


h1 {
    margin:0;
    font-size:1.5rem;
}


.container {
    display:flex;
    flex-direction:column;
}


nav {
    padding:10px;
    background:#151a20;
}


nav button {
    width:100%;
    margin:5px 0;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#263238;
    color:white;
    font-size:1rem;
}


nav button:hover {
    background:var(--accent);
    color:black;
}


main {
    padding:12px;
}


.card {
    background:var(--card);
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}


.progress {
    height:18px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}


.progress-bar {
    height:100%;
    width:0%;
    background:var(--green);
}


.resource {
    background:#252c33;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
}


.resource button {
    width:100%;
    margin-top:8px;
}


button {
    cursor:pointer;
}


.viewer {
    width:100%;
    min-height:500px;
}


.viewer iframe {
    width:100%;
    height:500px;
    border:none;
    background:white;
}


textarea {
    width:100%;
    min-height:150px;
    background:#111;
    color:white;
    padding:10px;
    border-radius:8px;
}


.timer {
    text-align:center;
    font-size:3rem;
}


@media(min-width:800px){

.container {
    flex-direction:row;
}

nav {
    width:260px;
    min-height:100vh;
}

nav button {
    width:100%;
}

main {
    flex:1;
    padding:25px;
}

}


</style>

</head>


<body>


<header>

<h1>Engineering Hub</h1>

<p>
Computer Engineering Preparation
</p>

</header>



<div class="container">


<nav>

<h3>Subjects</h3>

<div id="subjects"></div>


<hr>


<button onclick="missionPlan()">
Today's Mission Plan
</button>


<button onclick="backup()">
Export Backup
</button>


</nav>



<main>


<div class="card">

<h2 id="topicTitle">
Select Topic
</h2>

<p id="topicDescription">
Choose a subject.
</p>

<div id="resources"></div>


</div>



<div class="card">

<h2>Resource Viewer</h2>

<div id="viewer" class="viewer">

Select a PDF or lesson.

</div>


</div>




<div class="card">

<h2>Notes</h2>

<textarea id="notes"
placeholder="Engineering notebook..."></textarea>


</div>



<div class="card">

<h2>Progress</h2>

<div class="progress">

<div id="progressBar"
class="progress-bar">

</div>

</div>

<p id="progressText"></p>


</div>



<div class="card">

<h2>Study Timer</h2>

<div class="timer" id="timer">
60:00
</div>

<button onclick="startTimer()">
Start
</button>

<button onclick="resetTimer()">
Reset
</button>

</div>


</main>

</div>




<script>


const library = {


"Calculus":{

description:
"Calculus foundation for engineering.",

resources:[

{
title:"OpenStax Calculus Volume 1",
type:"web",
url:"https://openstax.org/details/books/calculus-volume-1"
},

{
title:"OpenStax Calculus Volume 2",
type:"web",
url:"https://openstax.org/details/books/calculus-volume-2"
}

]

},



"Physics":{

description:
"Mechanics, electricity, and magnetism.",

resources:[

{
title:"OpenStax University Physics Volume 1",
type:"web",
url:"https://openstax.org/details/books/university-physics-volume-1"
},

{
title:"OpenStax University Physics Volume 2",
type:"web",
url:"https://openstax.org/details/books/university-physics-volume-2"
}

]

},



"Digital Logic":{

description:
"Foundation for FPGA and hardware design.",

resources:[

{
title:"MIT Computation Structures",
type:"web",
url:"https://ocw.mit.edu/courses/6-004-computation-structures-spring-2009/"
},

{
title:"Nand2Tetris",
type:"web",
url:"https://www.nand2tetris.org/"
}

]

},



"Computer Architecture":{

description:
"CPU design and computer organization.",

resources:[

{
title:"MIT 6.004 Lecture Notes",
type:"web",
url:"https://ocw.mit.edu/courses/6-004-computation-structures-spring-2009/resources/lecture-notes/"
},

{
title:"Nand2Tetris Book",
type:"web",
url:"https://www.nand2tetris.org/book"

}

]

},



"Operating Systems":{

description:
"Processes, memory, concurrency, and systems.",

resources:[

{
title:"Operating Systems Three Easy Pieces",
type:"web",
url:"https://pages.cs.wisc.edu/~remzi/OSTEP/"
}

]

},



"C Programming":{

description:
"C programming for embedded systems.",

resources:[

{
title:"C Language Reference",
type:"web",
url:"https://en.cppreference.com/w/c"
}

]

},



"Circuits":{

description:
"Electrical engineering fundamentals.",

resources:[

{
title:"OpenStax Physics Electricity Sections",
type:"web",
url:"https://openstax.org/details/books/university-physics-volume-2"

}

]

},



"Embedded Systems":{

description:
"Firmware and hardware interaction.",

resources:[

{
title:"Embedded Systems Resources",
type:"web",
url:"https://users.ece.utexas.edu/~valvano/Volume1/"
}

]

},



"FPGA":{

description:
"Your primary specialization: digital hardware.",

resources:[

{
title:"FPGA Introduction",
type:"web",
url:"https://www.fpga4fun.com/"
}

]

},



"Robotics":{

description:
"Autonomous systems, sensors, and control.",

resources:[

{
title:"MIT Robotics",
type:"web",
url:"https://ocw.mit.edu/search/?q=robotics"

}

]

}


};


let currentTopic = null;

const subjectsDiv = document.getElementById("subjects");


Object.keys(library).forEach(subject => {

    const button = document.createElement("button");

    button.textContent = subject;

    button.onclick = () => loadSubject(subject);

    subjectsDiv.appendChild(button);

});



function loadSubject(subject){

    currentTopic = subject;

    const data = library[subject];

    document.getElementById("topicTitle").textContent = subject;

    document.getElementById("topicDescription").textContent =
        data.description;


    let html = "";


    data.resources.forEach((resource,index)=>{


        const key =
            subject + "_" + index;


        const completed =
            localStorage.getItem(key) ? "checked" : "";


        html += `

        <div class="resource">

            <b>${resource.title}</b>

            <br>

            <label>

            <input type="checkbox"
            ${completed}
            onclick="toggleComplete('${key}')">

            Completed

            </label>


            <button onclick='openResource(${JSON.stringify(resource)})'>

            Open Lesson

            </button>


        </div>

        `;


    });


    document.getElementById("resources").innerHTML = html;


    loadNotes();

    updateProgress();

}





function openResource(resource){


const viewer =
document.getElementById("viewer");



if(resource.type==="pdf"){


viewer.innerHTML = `

<iframe src="${resource.url}"></iframe>

`;


}


else{


viewer.innerHTML = `

<iframe src="${resource.url}"></iframe>

<br>

<a href="${resource.url}" target="_blank">

Open in Browser

</a>

`;

}


}




function toggleComplete(key){


if(localStorage.getItem(key)){

localStorage.removeItem(key);

}

else{

localStorage.setItem(key,"complete");

}


updateProgress();


}





function updateProgress(){


let total=0;

let done=0;


Object.keys(library).forEach(subject=>{


library[subject].resources.forEach((r,i)=>{


total++;


if(localStorage.getItem(subject+"_"+i)){

done++;

}


});


});



let percent =
Math.round(
(done/total)*100
);



document.getElementById("progressBar")
.style.width =
percent+"%";


document.getElementById("progressText")
.textContent =
percent+"% complete";


}





function loadNotes(){


const box =
document.getElementById("notes");


box.value =
localStorage.getItem(
"notes_"+currentTopic
) || "";



box.oninput=function(){


localStorage.setItem(
"notes_"+currentTopic,
box.value
);


};


}





function missionPlan(){


const subjects =
Object.keys(library);


const day =
new Date().getDate();


const first =
subjects[day % subjects.length];


const second =
subjects[(day+4)%subjects.length];


alert(

"Today's Engineering Mission:\n\n"+

"30 minutes:\n"+
first+

"\n\n30 minutes:\n"+
second+

"\n\nWrite one notebook entry."

);


}





let seconds = 3600;

let timer;



function startTimer(){


clearInterval(timer);



timer=setInterval(()=>{


seconds--;


let minutes =
Math.floor(seconds/60);


let remaining =
seconds%60;



document.getElementById("timer")
.textContent =

minutes+
":"+
(remaining<10?"0":"")+
remaining;



if(seconds<=0){

clearInterval(timer);

}


},1000);


}





function resetTimer(){


clearInterval(timer);


seconds=3600;


document.getElementById("timer")
.textContent="60:00";


}





function backup(){


let backup={};


for(let i=0;i<localStorage.length;i++){


const key =
localStorage.key(i);


backup[key]=
localStorage.getItem(key);


}



const blob =
new Blob(
[
JSON.stringify(backup,null,2)
],
{
type:"application/json"
}
);



const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href=url;


link.download=
"engineering_hub_backup.json";


link.click();


}





updateProgress();

</script>


</body>

</html>
